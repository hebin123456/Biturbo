name: Build

# Pushing a `v*` tag (or a manual workflow_dispatch) triggers this single
# pipeline: build, test, verify, upload artifact, and on tag also publish a
# GitHub Release. CI is folded in here so the cdylib is built only once per
# tag per platform. Pushing to master does not trigger anything.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build + Test + Release (${{ matrix.os_name }} ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x64 (MSVC) — libgit2.dll zlib ABI 兼容（保留原版序号）
          - os: windows-latest
            os_name: windows
            arch: x64
            target: x86_64-pc-windows-msvc
            artifact_name: biturbo.dll
            archive_prefix: biturbo-windows-x64
            needs_msvc: true
            release_asset: biturbo.dll
          # Linux x64 — libbiturbo.so
          # 锁定 ubuntu-22.04（glibc 2.35）而非 ubuntu-latest（24.04, glibc 2.39）：
          # cdylib 会记录构建机的 glibc 符号版本下限，在 24.04 上构建会引入
          # GLIBC_2.39 依赖（pidfd_* 等），导致 Ubuntu 22.04 等主流 LTS 无法加载
          # （version `GLIBC_2.39' not found）。glibc 只向前兼容，在老基线构建
          # 的产物可同时跑在 22.04 / 24.04 及更新发行版上。
          - os: ubuntu-22.04
            os_name: linux
            arch: x64
            target: x86_64-unknown-linux-gnu
            artifact_name: libbiturbo.so
            archive_prefix: biturbo-linux-x64
            needs_msvc: false
            release_asset: libbiturbo.so
          # Linux ARM64 — libbiturbo.so（GitHub 原生 ARM64 runner，公开仓库免费）
          # rustc 1.9x 起，所有 Linux cdylib 链接 rustc 都会注入自己的 anonymous
          # 版本脚本（列出 #[no_mangle] 符号 + local: *）。x86_64 上 rustc 默认用
          # 工具链自带 rust-lld——lld 能与 build.rs 传入的 biturbo.exports.map
          # （同为 anonymous 脚本）共存；aarch64 上 rustc 默认走 GNU ld，双匿名
          # 脚本报错：anonymous version tag cannot be combined with other version
          # tags。因此 Linux 两腿都显式改用工具链自带 rust-lld（见下方
          # "Use bundled rust-lld" 步骤），与 x64 的实际链路完全一致。
          # runner 同为 ubuntu-22.04 系（glibc 2.35 基线对齐）。
          # release 裸资产名用 libbiturbo-arm64.so 与 x64 的 libbiturbo.so 区分
          # （两个矩阵 job 同时上传同名资产会冲突）；下载方重命名为 libbiturbo.so
          # 使用（运行时 DllImport 的库名不变）。
          - os: ubuntu-22.04-arm
            os_name: linux
            arch: arm64
            target: aarch64-unknown-linux-gnu
            artifact_name: libbiturbo.so
            archive_prefix: biturbo-linux-arm64
            needs_msvc: false
            release_asset: libbiturbo-arm64.so
          # macOS ARM64 — libbiturbo.dylib（native Apple Silicon runner）
          # 仅构建 ARM64（Apple Silicon，2020 年后 Mac 主流架构）；不构建 x64
          - os: macos-14
            os_name: macos
            arch: arm64
            target: aarch64-apple-darwin
            artifact_name: libbiturbo.dylib
            archive_prefix: biturbo-macos-arm64
            needs_msvc: false
            release_asset: libbiturbo.dylib

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          target: ${{ matrix.target }}

      - name: Set up MSVC dev environment (for dumpbin)
        if: matrix.needs_msvc
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Linux build deps (cmake + llvm)
        if: matrix.os_name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config

      - name: Use bundled rust-lld (Linux)
        # rustc 链接 cdylib 时会注入自己的 anonymous 版本脚本；GNU ld 无法与
        # build.rs 传入的 biturbo.exports.map（同为 anonymous 脚本）共存
        # （anonymous version tag cannot be combined with other version tags），
        # rust-lld 则按"精确符号匹配优先于 local: * 通配"合并两份脚本。
        # x86_64 上 rustc 本就默认使用工具链自带 rust-lld；aarch64 上默认
        # GNU ld，故显式切换到同一份 rust-lld（-B 指向 sysroot 内 gcc-ld
        # 目录 + -fuse-ld=lld），使两腿 Linux 构建链路一致，也免受 rustc
        # 默认链接器变动影响。
        if: matrix.os_name == 'linux'
        run: |
          set -e
          SYSROOT="$(rustc --print sysroot)"
          LD_DIR="$SYSROOT/lib/rustlib/${{ matrix.target }}/bin/gcc-ld"
          test -x "$LD_DIR/ld.lld" || { echo "::error::bundled ld.lld not found at $LD_DIR"; exit 1; }
          echo "Using bundled rust-lld: $LD_DIR/ld.lld"
          echo "RUSTFLAGS=-C link-arg=-B$LD_DIR -C link-arg=-fuse-ld=lld" >> "$GITHUB_ENV"

      - name: Install macOS build deps (cmake)
        if: matrix.os_name == 'macos'
        run: brew install cmake ninja

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Derive version from tag
        id: ver
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          # tag looks like v1.0.0 -> strip leading 'v'
          TAG="${GITHUB_REF_NAME#v}"
          echo "version=$TAG" >> "$GITHUB_OUTPUT"
          echo "Releasing version $TAG"

      - name: Sync Cargo.toml version with tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          # Replace the first top-level `version = "..."` line (package version).
          # Allow an optional pre-release suffix so pre-release -> release works.
          sed -i -E "0,/^version = \"[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?\"$/s//version = \"$VERSION\"/" Cargo.toml
          grep -m1 -E '^version = ' Cargo.toml

      - name: Build release cdylib
        run: cargo build --release --target ${{ matrix.target }}

      - name: Run unit + integration tests
        # 既跑 lib 单元测试，也跑 tests/ 下的 FFI 集成测试。
        # 不带 --lib，cargo test 会自动包含集成测试。
        run: cargo test --release --target ${{ matrix.target }}

      - name: Verify build output exists
        shell: bash
        run: |
          set -e
          LIB="target/${{ matrix.target }}/release/${{ matrix.artifact_name }}"
          test -f "$LIB" || { echo "$LIB not found"; exit 1; }
          SIZE=$(wc -c < "$LIB")
          echo "Built: $LIB ($SIZE bytes)"

      - name: Verify PE magic (Windows only)
        if: matrix.os_name == 'windows'
        shell: bash
        run: |
          set -e
          DLL="target/${{ matrix.target }}/release/${{ matrix.artifact_name }}"
          # Sanity: first two bytes should be 'MZ' (PE/DLL magic).
          head -c 2 "$DLL" | od -An -c | grep -q 'M   Z' && echo "PE magic OK"

      - name: Verify symbol exports match biturbo.def
        shell: bash
        run: |
          python3 scripts/check_exports.py \
            "target/${{ matrix.target }}/release/${{ matrix.artifact_name }}" \
            biturbo.def

      - name: Verify glibc baseline (Linux only, must be <= 2.35)
        # 守护步骤：防止 runner 镜像悄悄升级导致产物 glibc 下限回升。
        # 产物依赖的最高 GLIBC 符号版本不得超过 ubuntu-22.04 基线（2.35）。
        if: matrix.os_name == 'linux'
        shell: bash
        run: |
          set -e
          LIB="target/${{ matrix.target }}/release/${{ matrix.artifact_name }}"
          MAX=$(objdump -T "$LIB" | grep -oE 'GLIBC_2\.[0-9]+' | sort -uV | tail -1 | cut -d. -f2)
          echo "Highest glibc symbol version required: 2.${MAX:-0}"
          if [ -n "$MAX" ] && [ "$MAX" -gt 35 ]; then
            echo "::error::libbiturbo.so requires glibc 2.$MAX > 2.35 (Ubuntu 22.04 baseline). Pin the Linux runner to ubuntu-22.04."
            exit 1
          fi
          echo "glibc baseline OK (<= 2.35)"

      - name: Stage release artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          STAGE="staging/${{ matrix.archive_prefix }}-$VERSION"
          mkdir -p "$STAGE"
          # release_asset：Release 裸资产名（Linux ARM64 为 libbiturbo-arm64.so，
          # 避免与 x64 的 libbiturbo.so 同名冲突；其余平台与产物同名）。
          cp "target/${{ matrix.target }}/release/${{ matrix.artifact_name }}" "$STAGE/${{ matrix.release_asset }}"
          cp biturbo.def "$STAGE/"
          # Windows 链接器产物（import library / export table），如存在则一并打包。
          if [ "${{ matrix.os_name }}" = "windows" ]; then
            cp "target/${{ matrix.target }}/release/biturbo.dll.lib" "$STAGE/" 2>/dev/null || true
            cp "target/${{ matrix.target }}/release/biturbo.dll.exp" "$STAGE/" 2>/dev/null || true
          fi
          (cd staging && 7z a -tzip "${{ matrix.archive_prefix }}-$VERSION.zip" "${{ matrix.archive_prefix }}-$VERSION")
          ls -la staging

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive_prefix }}
          path: target/${{ matrix.target }}/release/${{ matrix.artifact_name }}
          if-no-files-found: error

      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            staging/${{ matrix.archive_prefix }}-*/${{ matrix.release_asset }}
            staging/${{ matrix.archive_prefix }}-*/biturbo.def
            staging/${{ matrix.archive_prefix }}-*.zip
